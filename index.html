<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منظومة الصالون</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#1d2a2c;--mut:#6b7775;--line:#dfe6e4;--pri:#1f3a3d;--ok:#137a4b;--okb:#e3f3ea;--warn:#a96d00;--warnb:#fff3d6;--bad:#c0182d;--badb:#fde4e6;
 --f:'IBM Plex Sans Arabic',Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121a1b;--card:#1b2526;--ink:#e7eeec;--mut:#9aa8a5;--line:#2c3a3b;--pri:#2c5459;--okb:#173326;--warnb:#3a2e12;--badb:#3d1a1e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:15px var(--f);background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:17px}header .sp{flex:1}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{background:transparent;border:1px solid var(--line);color:var(--ink)}nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:16px;max-width:1200px;margin:auto;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:10px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.k{background:var(--bg);border-radius:10px;padding:10px}.k small{color:var(--mut)}.k b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
button{font:600 14px var(--f);padding:8px 12px;border-radius:9px;border:0;background:var(--pri);color:#fff;cursor:pointer}
button.g{background:var(--ok)}button.o{background:var(--bg);color:var(--ink);border:1px solid var(--line)}button.r{background:var(--badb);color:var(--bad)}
button:disabled{opacity:.5}
input,select,textarea{font:14px var(--f);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.row>button{flex:0 0 auto;min-width:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600}
td{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.waiting{background:var(--warnb);color:var(--warn)}.in_service{background:#dde8fb;color:#2d5ea8}.done{background:#efe3fb;color:#6b3fa0}.paid,.matched,.approved,.booked{background:var(--okb);color:var(--ok)}.cancelled,.mismatch,.rejected,.no_show{background:var(--badb);color:var(--bad)}.pending,.checked_in{background:var(--warnb);color:var(--warn)}
.note{font-size:13px;color:var(--mut)}.lock{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:13px;color:var(--mut)}
#toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:520px;margin:auto;padding:12px;border-radius:10px;color:#fff;display:none;z-index:9}
.login{max-width:380px;margin:40px auto}
.chip{display:inline-block;margin:2px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--card)}.chip.on{background:var(--pri);color:#fff}
</style></head><body>
<header><b>منظومة الصالون</b><span id="who" class="sp"></span><button class="o" id="bookBtn" onclick="showBooking()">صفحة الحجز للعميل</button><button class="o" id="outBtn" hidden onclick="logout()">خروج</button></header>
<nav id="nav" hidden></nav>
<main id="app"></main>
<div id="toast"></div>
<script>
const SB_URL='https://hnztsplyaypzclwwzubx.supabase.co', SB_KEY='sb_publishable_9auqTD0ZqExwsTgZXnEX4A_bLNf4W4s';
const sb=supabase.createClient(SB_URL,SB_KEY);
let me=null, view=null, cache={};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=x=>Number(x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const tm=d=>d?new Date(d).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'—';
const mins=d=>d?Math.round((Date.now()-new Date(d))/60000):0;
const ST={waiting:'ينتظر',in_service:'على الكرسي',done:'بانتظار الدفع',paid:'مدفوع',cancelled:'ملغي',pending:'معلّق',approved:'معتمد',rejected:'مرفوض',sent:'أُرسلت',matched:'مطابق',mismatch:'غير مطابق',booked:'محجوز',checked_in:'وصل',no_show:'لم يحضر'};
const pill=s=>`<span class="pill ${s}">${ST[s]||s}</span>`;
function toast(m,ok=true){const t=$('#toast');t.textContent=m;t.style.background=ok?'var(--ok)':'var(--bad)';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4000)}
async function rpc(fn,args,msg){const {data,error}=await sb.rpc(fn,args);if(error){toast(error.message,false);throw error}if(msg)toast(msg);return data}
async function q(t,sel='*',f=x=>x){const {data,error}=await f(sb.from(t).select(sel));if(error){toast(error.message,false);return[]}return data}

const MENU={
 reception:[['queue','الدور'],['bookings','حجوزات اليوم'],['cashier','الدفع'],['packages','الباقات']],
 barber:[['chair','كرسيي'],['myclients','عملائي'],['mypay','عمولتي']],
 supervisor:[['board','لوحة اليوم'],['queue','الدور'],['bookings','الحجوزات'],['cashier','الدفع'],['approvals','الموافقات'],['campaigns','الحملات'],['packages','الباقات']],
 finance:[['close','الإقفال اليومي'],['commissions','العمولات'],['incidents','البلاغات'],['reports','التقارير']],
 admin:[['settings','الإعدادات'],['reports','التقارير'],['commissions','العمولات'],['campaigns','الحملات'],['audit','سجل التدقيق'],['incidents','البلاغات']]};

async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return loginView();
 const {data}=await sb.from('profiles').select('*').eq('user_id',session.user.id).single();
 if(!data){toast('الحساب غير مربوط بدور',false);return logout()}
 me=data;$('#who').textContent=`${me.full_name} · ${({reception:'الاستقبال/الكاشير',barber:'حلاق',supervisor:'المشرف',finance:'المالية',admin:'الإدارة'})[me.role]}`;
 $('#outBtn').hidden=false;$('#bookBtn').hidden=true;
 const nav=$('#nav');nav.hidden=false;nav.innerHTML=MENU[me.role].map(([k,l])=>`<button data-v="${k}">${l}</button>`).join('');
 nav.onclick=e=>{if(e.target.dataset.v)go(e.target.dataset.v)};
 await loadRefs();go(MENU[me.role][0][0]);
 setInterval(()=>{if(['queue','board','chair','cashier'].includes(view)&&!document.activeElement.matches('input,select,textarea'))go(view)},20000)}
async function loadRefs(){cache.services=await q('services','*',x=>x.eq('active',true).order('price'));cache.products=await q('products','*',x=>x.eq('active',true));
 cache.barbers=await q('profiles','user_id,full_name,chair_no,role',x=>x.eq('role','barber').eq('active',true).order('chair_no'));cache.packages=await q('packages','*',x=>x.eq('active',true))}
function go(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));V[v]()}
function loginView(){$('#nav').hidden=true;$('#outBtn').hidden=true;$('#bookBtn').hidden=false;$('#who').textContent='';
 app.innerHTML=`<div class="card login"><h2>تسجيل الدخول</h2><form id="lf" class="grid" style="grid-template-columns:1fr">
 <input id="em" type="email" placeholder="البريد" required><input id="pw" type="password" placeholder="كلمة المرور" required><button>دخول</button></form>
 <p class="note">الصلاحيات تُفرض في الخادم حسب الدور، لا في الشاشة.</p></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('بيانات الدخول غير صحيحة',false);init()}}
async function logout(){await sb.auth.signOut();me=null;loginView()}

const V={};
/* ===== 1 reception queue ===== */
V.queue=async()=>{const t=await q('tickets','*,customers(full_name,phone)',x=>x.in('status',['waiting','in_service','done']).order('opened_at'));
 const today=await q('tickets','id',x=>x.gte('opened_at',new Date().toISOString().slice(0,10)));
 const bopts=cache.barbers.map(b=>`<option value="${b.user_id}">${esc(b.full_name)} · كرسي ${b.chair_no??''}</option>`).join('');
 app.innerHTML=`<div class="card"><div class="kp"><div class="k"><small>ينتظر</small><b>${t.filter(x=>x.status=='waiting').length}</b></div><div class="k"><small>على الكرسي</small><b>${t.filter(x=>x.status=='in_service').length}</b></div><div class="k"><small>بانتظار الدفع</small><b>${t.filter(x=>x.status=='done').length}</b></div><div class="k"><small>تذاكر اليوم</small><b>${today.length}</b></div></div></div>
 <div class="card"><h2>فتح تذكرة</h2><form id="of" class="row"><input id="ph" placeholder="جوال العميل 05XXXXXXXX" pattern="05[0-9]{8}" required><input id="nm" placeholder="الاسم (لعميل جديد)"><input id="bd" type="date" title="تاريخ الميلاد (اختياري)">
 <label style="flex:0 0 auto"><input id="cs" type="checkbox" style="width:auto"> يوافق على العروض</label><button class="g">فتح تذكرة</button></form>
 <p class="note">S01: لا خدمة بلا تذكرة. موافقة العروض تُحفظ بتاريخها.</p></div>
 <div class="card"><h2>الدور</h2><div class="tw"><table><tr><th>التذكرة</th><th>العميل</th><th>الحالة</th><th>منذ</th><th>الحلاق</th><th></th></tr>
 ${t.map(x=>`<tr><td>${x.ticket_no}</td><td>${esc(x.customers?.full_name)}</td><td>${pill(x.status)}</td><td>${mins(x.opened_at)} د</td>
 <td>${x.status=='waiting'?`<select id="as-${x.id}"><option value="">— اختر —</option>${bopts}</select>`:esc(cache.barbers.find(b=>b.user_id==x.barber_id)?.full_name||'—')}</td>
 <td>${x.status=='waiting'?`<button class="o" onclick="assign('${x.id}')">إسناد</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="note">لا أحد في الدور</td></tr>'}</table></div></div>`;
 t.filter(x=>x.status=='waiting'&&x.barber_id).forEach(x=>{const s=$('#as-'+x.id);if(s)s.value=x.barber_id});
 $('#of').onsubmit=async e=>{e.preventDefault();const r=await rpc('open_ticket',{p_phone:$('#ph').value.trim(),p_name:$('#nm').value.trim()||'عميل',p_consent:$('#cs').checked,p_birthday:$('#bd').value||null},'تم فتح التذكرة');go('queue')}};
window.assign=async id=>{const b=$('#as-'+id).value;if(!b)return toast('اختر الحلاق',false);await rpc('assign_ticket',{p_ticket:id,p_barber:b},'تم الإسناد');go(view)};

/* bookings */
V.bookings=async()=>{const d=new Date().toISOString().slice(0,10);
 const b=await q('bookings','*,customers(full_name,phone),services(name)',x=>x.gte('starts_at',d).order('starts_at').limit(100));
 app.innerHTML=`<div class="card"><h2>الحجوزات القادمة</h2><div class="tw"><table><tr><th>الوقت</th><th>العميل</th><th>الخدمة</th><th>الحلاق</th><th>الحالة</th><th></th></tr>
 ${b.map(x=>`<tr><td>${new Date(x.starts_at).toLocaleString('ar-SA',{weekday:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(x.customers?.full_name)}</td><td>${esc(x.services?.name)}</td><td>${esc(cache.barbers.find(y=>y.user_id==x.barber_id)?.full_name||'أي حلاق')}</td><td>${pill(x.status)}</td>
 <td>${x.status=='booked'?`<button class="g" onclick="checkin('${x.id}')">وصل</button> <button class="r" onclick="noshow('${x.id}')">لم يحضر</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="note">لا حجوزات</td></tr>'}</table></div>
 <p class="note">«وصل» يفتح تذكرة تلقائيًا ويدخل العميل الدور. «لم يحضر» متاح بعد وقت الموعد فقط.</p></div>`};
window.checkin=async id=>{await rpc('check_in_booking',{p_booking:id},'دخل العميل الدور');go(view)};
window.noshow=async id=>{await rpc('mark_no_show',{p_booking:id},'سُجّل عدم الحضور');go(view)};

/* ===== 3 cashier ===== */
V.cashier=async()=>{const t=await q('tickets','*,customers(id,full_name),ticket_items(*,services(name),products(name)),discount_requests(*)',x=>x.eq('status','done').order('finished_at'));
 app.innerHTML=`<div class="card"><h2>بانتظار الدفع (${t.length})</h2><p class="note">S02 لا إغلاق بلا فاتورة · S03 الحلاق لا يقبض · S04 الخصم بموافقة المشرف · الأسعار شاملة الضريبة</p></div>`+
 (await Promise.all(t.map(async x=>{const gross=x.ticket_items.reduce((a,i)=>a+Number(i.line_total),0);
  const disc=x.discount_requests.filter(d=>d.status=='approved').reduce((a,d)=>a+Number(d.amount),0);const pend=x.discount_requests.some(d=>d.status=='pending');
  const pk=await q('customer_packages','*,packages(name,service_id)',y=>y.eq('customer_id',x.customer_id).gte('expires_on',new Date().toISOString().slice(0,10)));
  const okPk=pk.filter(p=>p.sessions_used<p.sessions_total&&x.ticket_items.some(i=>i.service_id==p.packages.service_id));
  const tot=gross-disc, sub=Math.round(tot/1.15*100)/100;
  return `<div class="card"><h2>${x.ticket_no} · ${esc(x.customers.full_name)} <span class="note">الحلاق: ${esc(cache.barbers.find(b=>b.user_id==x.barber_id)?.full_name)}</span></h2>
  <div class="tw"><table>${x.ticket_items.map(i=>`<tr><td>${esc(i.services?.name||i.products?.name)}${i.qty>1?' ×'+i.qty:''}</td><td>${n2(i.line_total)}</td></tr>`).join('')}
  ${disc?`<tr><td>خصم معتمد</td><td>-${n2(disc)}</td></tr>`:''}<tr><td>قبل الضريبة</td><td>${n2(sub)}</td></tr><tr><td>ضريبة 15%</td><td>${n2(tot-sub)}</td></tr><tr><th>الإجمالي</th><th>${n2(tot)}</th></tr></table></div>
  ${pend?'<p class="pill pending">طلب خصم معلّق عند المشرف</p>':''}
  <div class="row" style="margin-top:8px"><input id="ca-${x.id}" type="number" step="0.01" placeholder="نقد"><input id="cd-${x.id}" type="number" step="0.01" placeholder="مدى/جيديا"><input id="tr-${x.id}" type="number" step="0.01" placeholder="تحويل">
  ${okPk.length?`<select id="pk-${x.id}"><option value="">بدون باقة</option>${okPk.map(p=>`<option value="${p.id}">${esc(p.packages.name)} (${p.sessions_used}/${p.sessions_total})</option>`).join('')}</select>`:''}</div>
  <div class="row" style="margin-top:8px"><button class="g" onclick="pay('${x.id}',${tot})">إصدار الفاتورة والقبض</button><button class="o" onclick="fill('${x.id}',${tot})">الكل نقد</button>
  <input id="dsa-${x.id}" type="number" placeholder="مبلغ الخصم"><input id="dsr-${x.id}" placeholder="سبب الخصم"><button class="r" onclick="disc('${x.id}')">طلب خصم ← المشرف</button></div></div>`}))).join('')};
window.fill=(id,t)=>{$('#ca-'+id).value=t.toFixed(2)};
window.pay=async(id)=>{const p=[['cash','ca'],['card','cd'],['transfer','tr']].map(([m,k])=>({method:m,amount:Number($(`#${k}-${id}`).value||0)})).filter(x=>x.amount>0);
 const pk=$('#pk-'+id)?.value||null;const inv=await rpc('pay_ticket',{p_ticket:id,p_payments:p,p_package:pk});toast(`صدرت ${inv.invoice_no} · ${n2(inv.total)}`);go(view)};
window.disc=async id=>{await rpc('request_discount',{p_ticket:id,p_amount:Number($('#dsa-'+id).value),p_reason:$('#dsr-'+id).value},'أُرسل الطلب للمشرف');go(view)};

/* packages */
V.packages=async()=>{const cp=await q('customer_packages','*,customers(full_name,phone),packages(name)',x=>x.order('sold_at',{ascending:false}).limit(100));
 app.innerHTML=`<div class="card"><h2>بيع باقة</h2><form id="pf" class="row"><input id="pph" placeholder="جوال العميل" required><select id="ppk">${cache.packages.map(p=>`<option value="${p.id}">${esc(p.name)} · ${n2(p.price)}</option>`).join('')}</select>
 <select id="ppm"><option value="cash">نقد</option><option value="card">مدى/جيديا</option><option value="transfer">تحويل</option></select><button class="g">بيع</button></form>
 <p class="note">S06: رصيد الباقة يُخصم آليًا عند الفاتورة فقط ولا يُعدَّل يدويًا. قيمة الباقة إيراد مؤجل يُعترف به مع كل جلسة.</p></div>
 <div class="card"><h2>الباقات المباعة</h2><div class="tw"><table><tr><th>العميل</th><th>الباقة</th><th>المستخدم</th><th>ينتهي</th></tr>
 ${cp.map(x=>`<tr><td>${esc(x.customers?.full_name)}</td><td>${esc(x.packages?.name)}</td><td>${x.sessions_used} / ${x.sessions_total}</td><td>${x.expires_on}</td></tr>`).join('')||'<tr><td colspan="4" class="note">لا يوجد</td></tr>'}</table></div></div>`;
 $('#pf').onsubmit=async e=>{e.preventDefault();const c=await q('customers','id',x=>x.eq('phone',$('#pph').value.trim()));if(!c.length)return toast('العميل غير مسجل — افتح له تذكرة أولًا',false);
  await rpc('sell_package',{p_customer:c[0].id,p_package:$('#ppk').value,p_method:$('#ppm').value},'تم بيع الباقة');go('packages')}};

/* ===== 2 barber chair + 12 receipt photo ===== */
V.chair=async()=>{const t=await rpc('barber_my_tickets');const cur=t.find(x=>x.status=='in_service');const wait=t.filter(x=>x.status=='waiting');
 const doneT=t.filter(x=>x.status=='done'||x.status=='paid');const ph=await q('receipt_photos','ticket_id,match_status',x=>x.eq('taken_by',me.user_id));
 app.innerHTML=`<div class="grid"><div class="card"><h2>الخدمة الجارية</h2>${cur?`<h3>${cur.ticket_no} · ${esc(cur.customer)}</h3>
 <p class="note">بدأ ${tm(cur.started_at)} · ${mins(cur.started_at)} دقيقة${cur.usual?' · المعتاد: '+esc(cur.usual):''}</p>
 <p>${cur.items.map(i=>esc(i.name)+(i.qty>1?' ×'+i.qty:'')).join(' + ')||'<span class="note">لم تُضف خدمات بعد</span>'}</p>
 <div class="row"><select id="sv">${cache.services.map(s=>`<option value="${s.id}">${esc(s.name)} · ${n2(s.price)}</option>`).join('')}</select><button class="o" onclick="addI('service','${cur.id}')">+ خدمة</button></div>
 <div class="row" style="margin-top:6px"><select id="pr">${cache.products.map(s=>`<option value="${s.id}">${esc(s.name)} · ${n2(s.price)}</option>`).join('')}</select><button class="o" onclick="addI('product','${cur.id}')">+ منتج</button></div>
 <button class="g" style="width:100%;margin-top:10px" onclick="finish('${cur.id}')">انتهيت ✓</button>`:'<p class="note">لا توجد خدمة جارية</p>'}
 <div class="lock" style="margin-top:10px">لا يقبض الحلاق أي مبلغ (S03)</div></div>
 <div class="card"><h2>دوري (${wait.length})</h2>${wait.map(x=>`<div class="row" style="margin-bottom:6px"><span>${x.ticket_no} · ${esc(x.customer)}${x.usual?` <span class="note">(${esc(x.usual)})</span>`:''}</span><button onclick="startS('${x.id}')" ${cur?'disabled':''}>ابدأ</button></div>`).join('')||'<p class="note">لا أحد في دورك</p>'}</div></div>
 <div class="card"><h2>إيصالات عملاء اليوم</h2><p class="note">صوّر الإيصال الذي سلّمه الكاشير للعميل. الخادم يطابق رقم الفاتورة والمبلغ، وأي اختلاف يفتح بلاغًا رقابيًا على الكاشير.</p>
 ${doneT.map(x=>{const p=ph.filter(y=>y.ticket_id==x.id);return `<div class="card" style="margin-top:8px"><b>${x.ticket_no} · ${esc(x.customer)}</b> ${pill(x.status)}

V.audit=async()=>{const a=await q('audit_log','*',x=>x.order('id',{ascending:false}).limit(150));
 app.innerHTML=`<div class="card"><h2>سجل التدقيق</h2><p class="note">لا يُعدَّل ولا يُحذف</p><div class="tw"><table><tr><th>الوقت</th><th>الجدول</th><th>العملية</th><th>من</th><th>التغيير</th></tr>
 ${a.map(x=>{let ch='';if(x.before&&x.after){ch=Object.keys(x.after).filter(k=>JSON.stringify(x.after[k])!==JSON.stringify(x.before[k])).map(k=>`${k}: ${esc(x.before[k])} ← ${esc(x.after[k])}`).join(' · ')}
  return `<tr><td>${new Date(x.at).toLocaleString('ar-SA')}</td><td>${x.table_name}</td><td>${x.action}</td><td>${esc(cache.who?.[x.actor]||'')}</td><td style="white-space:normal;max-width:420px">${ch}</td></tr>`}).join('')}</table></div></div>`};

/* 9 public booking */
async function showBooking(){const c=await rpc('public_catalog');$('#nav').hidden=true;let sel={svc:null,bar:null};
 app.innerHTML=`<div class="card login"><h2>احجز موعدك</h2><form id="bf" class="grid" style="grid-template-columns:1fr">
 <select id="bb">${(c.branches||[]).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select>
 <div><b>الخدمة</b><div id="bsv">${(c.services||[]).map(s=>`<span class="chip" data-id="${s.id}">${esc(s.name)} · ${s.duration} د · ${n2(s.price)} ر.س</span>`).join('')}</div><p class="note">الأسعار شاملة الضريبة</p></div>
 <div><b>الحلاق</b><div id="bbr"><span class="chip on" data-id="">أي حلاق</span>${(c.barbers||[]).map(s=>`<span class="chip" data-id="${s.id}">${esc(s.name)}</span>`).join('')}</div></div>
 <input id="bt" type="datetime-local" required><input id="bn" placeholder="الاسم" required><input id="bp" placeholder="الجوال 05XXXXXXXX" pattern="05[0-9]{8}" required>
 <label><input id="bc" type="checkbox" style="width:auto"> أوافق على استلام عروض الصالون (اختياري، ويمكن الإيقاف لاحقًا)</label>
 <button class="g">تأكيد الحجز</button></form><p class="note">الدفع المقدم الاختياري يحتاج ربط بوابة دفع (مدى/Apple Pay/تمارا) — غير مفعّل بعد.</p>
 <button class="o" onclick="init()">رجوع</button></div>`;
 const pick=(box,key)=>$(box).onclick=e=>{const ch=e.target.closest('.chip');if(!ch)return;$(box).querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));ch.classList.add('on');sel[key]=ch.dataset.id||null};
 pick('#bsv','svc');pick('#bbr','bar');
 $('#bf').onsubmit=async e=>{e.preventDefault();if(!sel.svc)return toast('اختر الخدمة',false);
  await rpc('create_booking',{p_branch:$('#bb').value,p_service:sel.svc,p_barber:sel.bar,p_start:new Date($('#bt').value).toISOString(),p_name:$('#bn').value,p_phone:$('#bp').value,p_consent:$('#bc').checked},'تم الحجز ✓ نراك في موعدك');}}
init();
</script></body></html>
