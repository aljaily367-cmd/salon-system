<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منظومة الصالون</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#1e3a8a;--navy2:#2c4aa0;--bg:#eef1f7;--card:#fff;--ink:#1c2333;--mut:#667085;--line:#e3e7f0;--soft:#e8eefc;
 --ok:#15803d;--okb:#dcfce7;--wt:#a16207;--wtb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--red:#dc2626;--f:'IBM Plex Sans Arabic',Tahoma,sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px var(--f);background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
/* top bar */
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:20}
.logo{background:#fff;color:var(--navy);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:20px;flex:none}
.brand b{display:block;font-size:16px}.brand small{opacity:.8;font-size:11px}
.sp{flex:1}.usr{background:var(--navy2);border-radius:20px;padding:5px 12px;font-size:13px;white-space:nowrap}
.ham{display:none;background:var(--navy2);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:18px}
.sub{background:#fff;font-size:12px;color:var(--mut);padding:6px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.dot{color:#16a34a}
/* layout */
.wrap{display:flex;min-height:calc(100% - 100px)}
aside{width:240px;flex:none;background:#fff;border-left:1px solid var(--line);padding:10px;overflow:auto}
.sec{background:var(--soft);color:var(--navy);font-weight:700;border-radius:8px;padding:8px 10px;margin:10px 0 4px;font-size:14px}
.it{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.it:hover{background:#f5f7fc}.it.on{background:var(--navy);color:#fff}
.bd{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;min-width:20px;text-align:center}
main{flex:1;padding:18px;min-width:0;max-width:1200px}
h2{color:var(--navy);font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:14px 0 8px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;margin-bottom:18px}
.tile{text-align:center;cursor:pointer}.tb{background:#fff;border-radius:16px;height:100px;display:grid;place-items:center;box-shadow:0 2px 8px #0000000f;position:relative;transition:transform .12s}
.tile:hover .tb{transform:translateY(-2px)}.tb .bd{position:absolute;top:8px;left:8px}.tile p{margin:8px 0 0;font-weight:600;font-size:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0000000d}.k small{color:var(--mut)}.k b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px #0000000d;margin-bottom:14px;min-width:0}
/* forms */
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;border:1px solid #d5dbe8;border-radius:10px;padding:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #93a4cf;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #d5dbe8;border-radius:10px;padding:9px 12px;cursor:pointer;background:#fff;font-size:14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:flex;gap:8px}.seg button{flex:1;border:1px solid #d5dbe8;border-radius:10px;padding:11px;font-weight:600;background:#fff;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cam{display:block;border:2px dashed #93a4cf;border-radius:12px;padding:16px;text-align:center;color:var(--navy);font-weight:600;background:#f3f6fd;cursor:pointer}
.cam img{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:0 auto 6px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.btn.g{background:#16a34a}.btn.o{background:#fff;color:var(--ink);border:1px solid #d5dbe8}.btn.r{background:var(--badb);color:var(--bad)}
.btn.big{width:100%;padding:14px;font-size:16px;margin-top:16px}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}.row>.btn{flex:0 0 auto;min-width:0}
.form{max-width:520px}
/* tables */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{padding:9px;border-bottom:1px solid #eef0f6;text-align:right;white-space:nowrap}th{background:#f3f6fd;color:var(--navy);font-weight:600}
td{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700}
.pending{background:var(--wtb);color:var(--wt)}.verified,.confirmed{background:var(--okb);color:var(--ok)}.rejected,.voided{background:var(--badb);color:var(--bad)}
.note{font-size:13px;color:var(--mut)}.lock{background:#f6f7fb;border:1px dashed #cdd3e3;border-radius:10px;padding:10px;font-size:13px;color:var(--mut)}
.okbox{background:var(--okb);border-radius:12px;padding:14px;color:var(--ok);font-weight:600}
#toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:520px;margin:auto;padding:12px 14px;border-radius:12px;color:#fff;display:none;z-index:50;font-weight:600}
.center{max-width:400px;margin:40px auto}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:#fff;border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
@media (max-width:820px){
 .ham{display:block}aside{position:fixed;top:56px;bottom:0;right:0;z-index:30;transform:translateX(100%);transition:transform .2s;box-shadow:-4px 0 20px #0002}
 aside.open{transform:none}.usr{display:none}main{padding:12px}.tiles{grid-template-columns:repeat(3,1fr);gap:10px}.tb{height:84px}.tb svg{width:42px;height:42px}
}
</style></head><body>
<div class="bar"><button class="ham" id="ham" aria-label="القائمة">☰</button><div class="logo">✂</div>
 <div class="brand"><b id="sname">منظومة الصالون</b><small id="ssub">إدارة الصالونات</small></div><div class="sp"></div><div class="usr" id="who" hidden></div>
 <button class="btn o" id="outBtn" hidden style="padding:6px 12px">خروج</button></div>
<div class="sub"><span><span class="dot" id="conn">●</span> <span id="connT">متصل بالخادم</span></span><span id="clock"></span></div>
<div class="wrap"><aside id="side" hidden></aside><main id="app"></main></div>
<div id="toast"></div>
<script>
const SB_URL='https://hnztsplyaypzclwwzubx.supabase.co', SB_KEY='sb_publishable_9auqTD0ZqExwsTgZXnEX4A_bLNf4W4s';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), app=$('#app');
let ME=null, view=null, badges={}, cache={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=x=>Number(x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'});
const dt=d=>new Date(d).toLocaleString('ar-SA-u-ca-gregory-nu-latn',{timeZone:'Asia/Riyadh',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const M={cash:'كاش',card:'شبكة',transfer:'تحويل'}, ST={pending:'بانتظار المطابقة',verified:'مطابق',rejected:'مرفوض',voided:'ملغي',confirmed:'مستلم'};
const R={owner:'المالك',supervisor:'المشرف',finance:'المالية',barber:'حلاق'};
const pill=s=>`<span class="pill ${s}">${ST[s]||s}</span>`;
function toast(m,ok=true){const t=$('#toast');t.textContent=m;t.style.background=ok?'#16a34a':'#b91c1c';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4500)}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error){toast(error.message,false);throw error}return data}
async function sel(t,cols='*',f=x=>x){const {data,error}=await f(sb.from(t).select(cols));if(error){toast(error.message,false);return[]}return data}
setInterval(()=>{const d=new Date();$('#clock').textContent='ميلادي '+d.toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'}).replace(/-/g,'/')+' · هجري '+d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',{timeZone:'Asia/Riyadh'})+' · '+d.toLocaleTimeString('ar-SA-u-nu-latn',{timeZone:'Asia/Riyadh'})},1000);
window.addEventListener('offline',()=>{$('#conn').style.color='#dc2626';$('#connT').textContent='غير متصل'});
window.addEventListener('online',()=>{$('#conn').style.color='#16a34a';$('#connT').textContent='متصل بالخادم'});

/* ---------- icons (flat, two-tone) ---------- */
const IC={
 plus:'<rect x="6" y="6" width="40" height="40" rx="10" fill="#16a34a"/><path d="M26 15v22M15 26h22" stroke="#fff" stroke-width="6" stroke-linecap="round"/>',
 scis:'<circle cx="16" cy="37" r="7" fill="none" stroke="#7c3a5a" stroke-width="5"/><circle cx="35" cy="37" r="7" fill="none" stroke="#16a3a0" stroke-width="5"/><path d="M20 31 38 6M31 31 13 6" stroke="#7c3a5a" stroke-width="5" stroke-linecap="round"/>',
 ppl:'<circle cx="18" cy="16" r="8" fill="#7c3a5a"/><circle cx="34" cy="18" r="7" fill="#f97316"/><path d="M4 44c0-13 28-13 28 0z" fill="#16a3a0"/><path d="M26 44c2-10 22-10 22 0z" fill="#f97316"/>',
 cash:'<rect x="4" y="14" width="42" height="24" rx="5" fill="#16a34a"/><circle cx="25" cy="26" r="7" fill="#fff"/><rect x="8" y="10" width="34" height="4" rx="2" fill="#86efac"/>',
 coin:'<ellipse cx="18" cy="37" rx="13" ry="7" fill="#f59e0b"/><rect x="5" y="29" width="26" height="8" fill="#f59e0b"/><circle cx="34" cy="16" r="12" fill="#16a3a0"/><rect x="32" y="9" width="4" height="14" rx="2" fill="#fff"/>',
 chart:'<circle cx="24" cy="26" r="18" fill="#f97316"/><path d="M24 8a18 18 0 0 1 18 18H24z" fill="#7c3a5a"/><circle cx="24" cy="26" r="7" fill="#fff"/>',
 check:'<rect x="8" y="4" width="34" height="44" rx="6" fill="#f59e0b"/><rect x="17" y="1" width="16" height="8" rx="3" fill="#16a3a0"/><path d="m16 27 6 6 12-13" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>',
 card:'<rect x="4" y="11" width="42" height="28" rx="5" fill="#2563eb"/><rect x="4" y="17" width="42" height="6" fill="#1e3a8a"/><rect x="10" y="29" width="14" height="4" rx="2" fill="#fff"/>',
 flag:'<rect x="12" y="6" width="5" height="40" rx="2" fill="#7c3a5a"/><path d="M17 8h26l-6 9 6 9H17z" fill="#ef4444"/>',
 gear:'<circle cx="25" cy="25" r="17" fill="#64748b"/><circle cx="25" cy="25" r="7" fill="#fff"/><path d="M25 2v8M25 40v8M2 25h8M40 25h8" stroke="#64748b" stroke-width="7"/>',
 list:'<rect x="6" y="6" width="38" height="38" rx="8" fill="#2563eb"/><path d="M15 17h20M15 25h20M15 33h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>',
 dash:'<path d="M5 34a20 20 0 0 1 40 0z" fill="#16a3a0"/><rect x="8" y="38" width="34" height="5" rx="2" fill="#1e3a8a"/><path d="m25 34 10-16" stroke="#1c2333" stroke-width="5" stroke-linecap="round"/><circle cx="25" cy="34" r="4" fill="#f97316"/>',
 store:'<path d="M6 20 10 8h30l4 12z" fill="#f97316"/><rect x="8" y="20" width="34" height="24" rx="3" fill="#2563eb"/><rect x="20" y="30" width="10" height="14" fill="#fff"/>',
 staff:'<circle cx="25" cy="15" r="9" fill="#2563eb"/><path d="M8 46c0-16 34-16 34 0z" fill="#16a3a0"/><rect x="19" y="30" width="12" height="4" rx="2" fill="#fff"/>',
 key:'<circle cx="17" cy="25" r="11" fill="#f59e0b"/><circle cx="17" cy="25" r="4" fill="#fff"/><path d="M27 25h18M38 25v8M44 25v6" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>'};
const ic=(k,s=54)=>`<svg width="${s}" height="${s}" viewBox="0 0 50 50" aria-hidden="true">${IC[k]}</svg>`;

/* ---------- menus per role ---------- */
const MENUS={
 barber:[['الرئيسية',[['home','لوحتي','dash']]],['عملي',[['record','تسجيل حلاقة','plus'],['myops','عملياتي','scis'],['mycust','عملائي','ppl']]],['المالية',[['mycash','عهدتي النقدية','cash'],['mypay','عمولتي','chart']]]],
 supervisor:[['الرئيسية',[['home','لوحة القيادة','dash']]],['العمليات',[['ops','عمليات الحلاقين','scis'],['handovers','استلام العهد','cash']]],['الرقابة',[['incidents','البلاغات','flag']]]],
 finance:[['الرئيسية',[['home','لوحة القيادة','dash']]],['العمليات',[['ops','عمليات الحلاقين','scis'],['handovers','استلام العهد','cash']]],['المالية',[['cardmatch','مطابقة الشبكة','card'],['commissions','العمولات','chart'],['incidents','البلاغات','flag']]]],
 owner:[['الرئيسية',[['home','لوحة القيادة','dash']]],['العمليات',[['ops','عمليات الحلاقين','scis'],['handovers','استلام العهد','cash']]],['المالية',[['cardmatch','مطابقة الشبكة','card'],['commissions','العمولات','chart'],['incidents','البلاغات','flag']]],['الإعدادات',[['services','الخدمات والأسعار','list'],['staff','الموظفون','staff'],['salon','بيانات الصالون','store']]]],
 platform:[['المزوّد',[['salons','الصالونات','store']]]]};
function menu(){const role=ME.profile?.role||'platform';let m=JSON.parse(JSON.stringify(MENUS[role]));if(ME.platform&&role!=='platform')m.push(...MENUS.platform);return m}
function renderSide(){$('#side').innerHTML=menu().map(([s,items])=>`<div class="sec">${s}</div>`+items.map(([k,l])=>`<div class="it ${view===k?'on':''}" data-v="${k}"><span>${l}</span>${badges[k]?`<span class="bd">${badges[k]}</span>`:''}</div>`).join('')).join('')+
 `<div class="sec">الحساب</div><div class="it ${view==='pw'?'on':''}" data-v="pw"><span>تغيير كلمة المرور</span></div>`}
$('#side').onclick=e=>{const it=e.target.closest('.it');if(it){go(it.dataset.v);$('#side').classList.remove('open')}};
$('#ham').onclick=()=>$('#side').classList.toggle('open');
$('#outBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
function tilesFor(sec){const m=menu().find(x=>x[0]===sec);return m?`<h2>${sec}</h2><div class="tiles">`+m[1].filter(x=>x[0]!=='home').map(([k,l,i])=>`<div class="tile" data-v="${k}"><div class="tb">${badges[k]?`<span class="bd">${badges[k]}</span>`:''}${ic(i)}</div><p>${l}</p></div>`).join('')+'</div>':''}
app.addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)go(t.dataset.v)});
async function go(v){view=v;renderSide();app.innerHTML='<p class="note">جارٍ التحميل…</p>';try{await V[v]()}catch(e){console.error(e);app.innerHTML='<div class="card">تعذّر تحميل الصفحة. تحقق من الاتصال ثم أعد المحاولة.</div>'}window.scrollTo(0,0)}
async function refreshBadges(){const r=ME.profile?.role;badges={};
 if(['owner','supervisor','finance'].includes(r)){const p=await sel('operations','id',x=>x.eq('status','pending').neq('method','cash'));badges.ops=p.length||'';
  const h=await sel('cash_handovers','id',x=>x.eq('status','pending'));badges.handovers=h.length||''}
 if(r==='barber'){const c=await rpc('my_cash');badges.mycash=c.count||''}renderSide()}

/* ---------- boot ---------- */
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return loginView();
 ME=await rpc('me');
 if(!ME.profile&&!ME.platform){app.innerHTML='<div class="card center">هذا الحساب غير مربوط بأي صالون. تواصل مع مالك الصالون.</div>';$('#outBtn').hidden=false;return}
 if(ME.profile&&!ME.profile.active){app.innerHTML='<div class="card center">تم إيقاف حسابك. تواصل مع مالك الصالون.</div>';$('#outBtn').hidden=false;return}
 $('#sname').textContent=ME.tenant?.name||'لوحة المزوّد';$('#ssub').textContent=ME.tenant?(ME.branch||'منظومة الصالون'):'منظومة الصالون';
 $('#who').textContent=ME.profile?`${ME.profile.full_name} · ${R[ME.profile.role]}${ME.profile.chair_no?' · كرسي '+ME.profile.chair_no:''}`:'المزوّد';
 $('#who').hidden=false;$('#outBtn').hidden=false;$('#side').hidden=false;
 if(ME.profile?.must_change_password)return go('pw');
 if(ME.tenant&&!ME.tenant.active)toast('اشتراك الصالون منتهٍ — يمكنك العرض فقط. تواصل مع مزوّد النظام',false);
 cache.services=ME.tenant?await sel('services','*',x=>x.eq('active',true).order('price')):[];
 go(ME.profile?'home':'salons');refreshBadges().catch(()=>{});
 setInterval(()=>refreshBadges().catch(()=>{}),60000)}
function loginView(){$('#side').hidden=true;
 app.innerHTML=`<div class="card center"><h2>تسجيل الدخول</h2><form id="lf"><label for="em">البريد الإلكتروني</label><input id="em" type="email" autocomplete="username" required>
 <label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" required><button class="btn big">دخول</button></form>
 <p class="note">الحسابات يُنشئها مالك الصالون. نسيت كلمة المرور؟ اطلب من المالك إعادة تعيينها.</p></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('البريد أو كلمة المرور غير صحيحة',false);boot()}}

const V={};
/* ---------- password ---------- */
V.pw=async()=>{const forced=ME.profile?.must_change_password;
 app.innerHTML=`<div class="card form"><h2>تغيير كلمة المرور</h2>${forced?'<p class="note">هذا أول دخول لك. اختر كلمة مرور خاصة بك لا يعرفها غيرك.</p>':''}
 <form id="pf"><label for="p1">كلمة المرور الجديدة (8 أحرف على الأقل)</label><input id="p1" type="password" minlength="8" autocomplete="new-password" required>
 <label for="p2">تأكيد كلمة المرور</label><input id="p2" type="password" minlength="8" autocomplete="new-password" required><button class="btn big">حفظ</button></form></div>`;
 $('#pf').onsubmit=async e=>{e.preventDefault();if($('#p1').value!==$('#p2').value)return toast('كلمتا المرور غير متطابقتين',false);
  const {error}=await sb.auth.updateUser({password:$('#p1').value});if(error)return toast(error.message,false);
  if(ME.profile)await rpc('password_changed');toast('تم تغيير كلمة المرور');ME=await rpc('me');boot()}};

/* ---------- home ---------- */
V.home=async()=>{const r=ME.profile.role;
 if(r==='barber'){const t=today();const ops=await rpc('barber_my_ops',{p_from:t,p_to:t});const c=await rpc('my_cash');const pay=(await rpc('commission_report',{p_month:t}))[0]||{};
  const live=ops.filter(o=>o.status!=='voided'&&o.status!=='rejected');
  app.innerHTML=`<h2>لوحتي</h2><div class="kp"><div class="k"><small>حلاقات اليوم</small><b>${live.length}</b></div><div class="k"><small>مبيعات اليوم</small><b>${n2(live.reduce((a,o)=>a+Number(o.amount),0))}</b></div>
  <div class="k"><small>نقدية في عهدتي</small><b>${n2(c.in_hand)}</b></div><div class="k"><small>عمولتي الشهر (المطابق)</small><b>${n2(pay.commission)}</b></div></div>`+tilesFor('عملي')+tilesFor('المالية');return}
 const t=today();const d=await rpc('dashboard',{p_from:t,p_to:t});
 app.innerHTML=`<h2>لوحة القيادة — اليوم</h2><div class="kp"><div class="k"><small>العمليات</small><b>${d.count}</b></div><div class="k"><small>الإجمالي</small><b>${n2(d.amount)}</b></div>
 <div class="k"><small>كاش</small><b>${n2(d.cash)}</b></div><div class="k"><small>شبكة</small><b>${n2(d.card)}</b></div><div class="k"><small>تحويل</small><b>${n2(d.transfer)}</b></div>

function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;

V.cardmatch=async()=>{app.innerHTML=`<h2>مطابقة الشبكة</h2><div class="card form"><p class="note">الصق من تقرير جهاز الشبكة (أو ملف CSV) سطرًا لكل عملية: رقم الموافقة ثم المبلغ. يطابق النظام آليًا، ويعرض الاستثناءات فقط.</p>
 <label for="csvf">ملف CSV (اختياري)</label><input type="file" id="csvf" accept=".csv,.txt">
 <label for="rep">أو الصق هنا</label><textarea id="rep" rows="8" dir="ltr" placeholder="482917,80.00&#10;551204,120.00"></textarea><button class="btn g big" id="mb">مطابقة</button></div><div id="mres"></div>`;
 $('#csvf').onchange=async e=>{const f=e.target.files[0];if(f)$('#rep').value=await f.text()};
 $('#mb').onclick=async()=>{const rows=[];$('#rep').value.split(/\r?\n/).forEach(l=>{const p=l.split(/[,;\t]/).map(x=>x.trim().replace(/"/g,''));const a=p.find(x=>/^[0-9A-Za-z]{4,12}$/.test(x)&&!/^\d+\.\d+$/.test(x));const m=[...p].reverse().find(x=>/^\d+(\.\d{1,2})?$/.test(x.replace(/,/g,''))&&x!==a);if(a&&m)rows.push({approval:a,amount:Number(m)})});
  if(!rows.length)return toast('لم أجد أسطرًا صالحة — رقم الموافقة ثم المبلغ',false);
  const r=await rpc('match_card_report',{p_rows:rows});
  $('#mres').innerHTML=`<div class="kp"><div class="k"><small>أسطر التقرير</small><b>${rows.length}</b></div><div class="k"><small>طوبقت الآن</small><b style="color:var(--ok)">${r.matched}</b></div><div class="k"><small>مبلغ مختلف</small><b style="color:var(--bad)">${r.amount_mismatch.length}</b></div><div class="k"><small>في التقرير وليست في النظام</small><b style="color:var(--wt)">${r.not_in_system.length}</b></div><div class="k"><small>عمليات شبكة ما زالت معلّقة</small><b>${r.still_pending}</b></div></div>
  ${r.amount_mismatch.length?`<div class="card"><h3 style="margin-top:0">مبلغ مختلف</h3><table><tr><th>العملية</th><th>الموافقة</th><th>في النظام</th><th>في التقرير</th></tr>${r.amount_mismatch.map(x=>`<tr><td>${x.op_no}</td><td>${esc(x.approval)}</td><td>${n2(x.system)}</td><td>${n2(x.report)}</td></tr>`).join('')}</table></div>`:''}
  ${r.not_in_system.length?`<div class="card"><h3 style="margin-top:0">مبالغ دخلت الجهاز ولم يسجّلها أي حلاق</h3><p class="note">تحتاج تحقيقًا: قد تكون حلاقة لم تُسجَّل.</p><table><tr><th>الموافقة</th><th>المبلغ</th></tr>${r.not_in_system.map(x=>`<tr><td>${esc(x.approval)}</td><td>${n2(x.amount)}</td></tr>`).join('')}</table></div>`:''}`;refreshBadges()}};

/* ---------- commissions / incidents ---------- */
V.commissions=async()=>{const m=cache.m2||today().slice(0,7);const r=await rpc('commission_report',{p_month:m+'-01'});
 app.innerHTML=`<h2>العمولات والرواتب</h2><div class="card"><div class="row"><div><label for="m2">الشهر</label><input type="month" id="m2" value="${m}"></div><button class="btn" onclick="cache.m2=$('#m2').value;go('commissions')">عرض</button></div></div>
 <div class="card"><div class="tw"><table><tr><th>الحلاق</th><th>عمليات مطابقة</th><th>المطابق شامل</th><th>صافي قبل الضريبة</th><th>النسبة</th><th>العمولة</th><th>الراتب</th><th>الإجمالي</th><th>بانتظار المطابقة</th></tr>
 ${r.map(x=>`<tr><td>${esc(x.barber)}</td><td>${x.ops}</td><td>${n2(x.verified_amount)}</td><td>${n2(x.net_amount)}</td><td>${x.service_pct}%</td><td>${n2(x.commission)}</td><td>${n2(x.base_salary)}</td><th>${n2(x.total_pay)}</th><td>${Number(x.pending_amount)?`<span class="pill pending">${n2(x.pending_amount)}</span>`:'—'}</td></tr>`).join('')||'<tr><td colspan="9" class="note">لا حلاقين</td></tr>'}</table></div>
 <p class="note">العمولة على العمليات المطابقة فقط. أكمل المطابقة قبل اعتماد الرواتب.</p></div>`};
V.incidents=async()=>{const i=await sel('incidents','*',x=>x.order('created_at',{ascending:false}).limit(200));const K={op_rejected:'عملية مرفوضة',cash_variance:'فرق عهدة نقدية',op_voided:'عملية ملغاة'};
 app.innerHTML=`<h2>البلاغات والاستثناءات</h2><div class="card"><div class="tw"><table><tr><th>الوقت</th><th>النوع</th><th>المرجع</th><th>المبلغ</th><th>التفاصيل</th></tr>
 ${i.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${K[x.kind]||x.kind}</td><td>${esc(x.ref)}</td><td>${x.amount!=null?n2(x.amount):''}</td><td style="white-space:normal;min-width:240px">${esc(x.details)}</td></tr>`).join('')||'<tr><td colspan="5" class="note">لا بلاغات</td></tr>'}</table></div></div>`};

/* ---------- owner settings ---------- */
V.services=async()=>{const s=await sel('services','*',x=>x.order('price'));
 app.innerHTML=`<h2>الخدمات والأسعار</h2><div class="card"><p class="note">الأسعار شاملة الضريبة. تغيير السعر لا يمس العمليات السابقة، وكل تعديل يُسجَّل.</p><div class="tw"><table><tr><th>الخدمة</th><th>السعر</th><th>المدة (د)</th><th>نشطة</th><th></th></tr>
 ${s.map(x=>`<tr><td><input id="sn-${x.id}" value="${esc(x.name)}" aria-label="اسم الخدمة"></td><td><input id="sp-${x.id}" type="number" step="0.01" value="${x.price}" style="width:100px" aria-label="السعر"></td><td><input id="sd-${x.id}" type="number" value="${x.duration_min}" style="width:80px" aria-label="المدة"></td><td><input id="sa-${x.id}" type="checkbox" ${x.active?'checked':''} style="width:auto" aria-label="نشطة"></td><td><button class="btn o" onclick="saveS('${x.id}')">حفظ</button></td></tr>`).join('')}
 <tr><td><input id="sn-new" placeholder="خدمة جديدة" aria-label="اسم الخدمة"></td><td><input id="sp-new" type="number" step="0.01" style="width:100px" aria-label="السعر"></td><td><input id="sd-new" type="number" value="30" style="width:80px" aria-label="المدة"></td><td><input id="sa-new" type="checkbox" checked style="width:auto" aria-label="نشطة"></td><td><button class="btn g" onclick="saveS('new')">إضافة</button></td></tr></table></div></div>`};
window.saveS=async id=>{await rpc('set_service',{p_id:id==='new'?null:id,p_name:$('#sn-'+id).value,p_price:Number($('#sp-'+id).value),p_duration:Number($('#sd-'+id).value),p_active:$('#sa-'+id).checked});
 toast('حُفظ');cache.services=await sel('services','*',x=>x.eq('active',true).order('price'));go('services')};
V.staff=async()=>{const st=await rpc('list_staff');const br=await sel('branches','*',x=>x.order('name'));const bo=v=>br.map(b=>`<option value="${b.id}" ${b.id===v?'selected':''}>${esc(b.name)}</option>`).join('');
 const ro=v=>Object.entries(R).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('');
 app.innerHTML=`<h2>الموظفون</h2><div class="card"><h3 style="margin-top:0">إضافة موظف</h3><form id="nf"><div class="row">
 <div><label for="nn">الاسم</label><input id="nn" required></div><div><label for="ne">البريد (للدخول)</label><input id="ne" type="email" required></div><div><label for="np">كلمة مرور مؤقتة</label><input id="np" minlength="8" required></div></div>
 <div class="row"><div><label for="nr">الدور</label><select id="nr">${ro('barber')}</select></div><div><label for="nb">الفرع</label><select id="nb">${bo()}</select></div><div><label for="nc">رقم الكرسي</label><input id="nc" type="number"></div><button class="btn g">إضافة</button></div></form>
 <p class="note">سلّم الموظف بريده وكلمة المرور المؤقتة؛ يُطلب منه تغييرها عند أول دخول.</p></div>
 <div class="card"><div class="tw"><table><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الفرع</th><th>الكرسي</th><th>الراتب</th><th>العمولة %</th><th>نشط</th><th></th></tr>
 ${st.map(x=>`<tr><td>${esc(x.full_name)}</td><td dir="ltr" style="text-align:right">${esc(x.email)}</td><td><select id="r-${x.user_id}">${ro(x.role)}</select></td><td><select id="b-${x.user_id}">${bo(x.branch_id)}</select></td>
  <td><input id="c-${x.user_id}" type="number" value="${x.chair_no??''}" style="width:70px" aria-label="الكرسي"></td>
  <td>${x.role==='barber'?`<input id="s-${x.user_id}" type="number" value="${x.base_salary??0}" style="width:100px" aria-label="الراتب">`:'—'}</td><td>${x.role==='barber'?`<input id="p-${x.user_id}" type="number" value="${x.service_pct??0}" style="width:70px" aria-label="النسبة">`:'—'}</td>
  <td><input id="a-${x.user_id}" type="checkbox" ${x.active?'checked':''} style="width:auto" aria-label="نشط"></td>
  <td><button class="btn o" onclick="saveSt('${x.user_id}',${x.role==='barber'})">حفظ</button> <button class="btn o" onclick="resetPw('${x.user_id}','${esc(x.full_name)}')">🔑</button></td></tr>`).join('')}</table></div>
 <p class="note">لا يُحذف موظف؛ يُوقف فقط ويبقى سجلّه. لا يُوقف حلاق لديه نقدية لم تُستلم.</p></div>`;
 $('#nf').onsubmit=async e=>{e.preventDefault();await rpc('create_staff',{p_email:$('#ne').value,p_password:$('#np').value,p_name:$('#nn').value,p_role:$('#nr').value,p_branch:$('#nb').value||null,p_chair:$('#nc').value?Number($('#nc').value):null});toast('أُضيف الموظف');go('staff')}};
window.saveSt=async(u,isB)=>{await rpc('set_staff',{p_user:u,p_role:$('#r-'+u).value,p_branch:$('#b-'+u).value,p_chair:$('#c-'+u).value?Number($('#c-'+u).value):null,p_active:$('#a-'+u).checked});
 if(isB&&$('#s-'+u))await rpc('set_barber_pay',{p_user:u,p_salary:Number($('#s-'+u).value),p_pct:Number($('#p-'+u).value)});toast('حُفظ');go('staff')};
window.resetPw=(u,n)=>{modal(`<h3 style="margin-top:0">كلمة مرور مؤقتة لـ ${n}</h3><input id="rp" minlength="8" placeholder="8 أحرف على الأقل"><div class="row" style="margin-top:10px"><button class="btn" id="rpo">تعيين</button><button class="btn o" onclick="closeModal()">تراجع</button></div>`);
 $('#rpo').onclick=async()=>{await rpc('reset_staff_password',{p_user:u,p_password:$('#rp').value});closeModal();toast('عُيّنت — سيُطلب منه تغييرها عند الدخول')}};
V.salon=async()=>{ME=await rpc('me');const t=ME.tenant;const br=await sel('branches','*',x=>x.order('name'));
 app.innerHTML=`<h2>بيانات الصالون</h2><div class="card form"><form id="sf"><label for="tn1">اسم الصالون</label><input id="tn1" value="${esc(t.name)}" required>
 <label><input id="tvr" type="checkbox" ${t.vat_registered?'checked':''} style="width:auto"> مسجّل في ضريبة القيمة المضافة (الأسعار شاملة 15%)</label>
 <label for="tvn">الرقم الضريبي</label><input id="tvn" value="${esc(t.vat_no||'')}" dir="ltr" maxlength="15"><label for="tcr">السجل التجاري</label><input id="tcr" value="${esc(t.cr_no||'')}" dir="ltr">
 <label for="tph">الجوال</label><input id="tph" value="${esc(t.phone||'')}" dir="ltr"><label for="tci">المدينة</label><input id="tci" value="${esc(t.city||'')}"><button class="btn g big">حفظ</button></form></div>
 <div class="card form"><h3 style="margin-top:0">الفروع</h3>${br.map(b=>`<div class="row" style="margin-bottom:8px"><input id="br-${b.id}" value="${esc(b.name)}" aria-label="اسم الفرع"><button class="btn o" onclick="saveBr('${b.id}')">حفظ</button></div>`).join('')}
 <div class="row"><input id="br-new" placeholder="فرع جديد" aria-label="فرع جديد"><button class="btn g" onclick="saveBr('new')">إضافة</button></div></div>
 <div class="card form"><h3 style="margin-top:0">الاشتراك</h3><p>الخطة: <b>${({trial:'تجربة',monthly:'شهري',yearly:'سنوي'})[t.plan]}</b> · ينتهي: <b>${t.paid_until||'—'}</b></p></div>`;
 $('#sf').onsubmit=async e=>{e.preventDefault();await rpc('update_salon',{p_name:$('#tn1').value,p_vat_no:$('#tvn').value,p_cr_no:$('#tcr').value,p_phone:$('#tph').value,p_city:$('#tci').value,p_vat_registered:$('#tvr').checked});toast('حُفظت بيانات الصالون');ME=await rpc('me');$('#sname').textContent=ME.tenant.name}};
window.saveBr=async id=>{await rpc('set_branch',{p_id:id==='new'?null:id,p_name:$('#br-'+id).value});toast('حُفظ');go('salon')};

/* ---------- platform ---------- */
V.salons=async()=>{const s=await rpc('platform_list');const td=today();
 const soon=s.filter(x=>x.active&&x.paid_until&&x.paid_until>=td&&(new Date(x.paid_until)-new Date(td))/864e5<=7).length;
 app.innerHTML=`<h2>لوحة المزوّد</h2><div class="kp"><div class="k"><small>كل الصالونات</small><b>${s.length}</b></div><div class="k"><small>نشطة</small><b style="color:var(--ok)">${s.filter(x=>x.active&&(!x.paid_until||x.paid_until>=td)).length}</b></div><div class="k"><small>تنتهي خلال 7 أيام</small><b style="color:var(--wt)">${soon}</b></div><div class="k"><small>موقوفة/منتهية</small><b style="color:var(--bad)">${s.filter(x=>!x.active||(x.paid_until&&x.paid_until<td)).length}</b></div></div>
 <div class="card"><h3 style="margin-top:0">إضافة صالون</h3><form id="cf"><div class="row"><div><label for="c1">اسم الصالون</label><input id="c1" required></div><div><label for="c2">الرابط المختصر (إنجليزي)</label><input id="c2" dir="ltr" pattern="[a-z0-9-]{3,40}" placeholder="alnukhba" required></div></div>
 <div class="row"><div><label for="c3">اسم المالك</label><input id="c3" required></div><div><label for="c4">بريد المالك</label><input id="c4" type="email" required></div><div><label for="c5">كلمة مرور مؤقتة</label><input id="c5" minlength="8" required></div></div>
 <div class="row"><div><label for="c6">الخطة</label><select id="c6"><option value="trial">تجربة</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select></div><div><label for="c7">ينتهي في (فارغ = 14 يومًا)</label><input id="c7" type="date"></div><button class="btn g">إنشاء الصالون</button></div></form>
 <p class="note">يُنشأ الصالون بفرع رئيسي وقائمة خدمات مقترحة يعدّلها المالك. أنت ترى أرقام الاستخدام فقط، لا بيانات العملاء ولا المبالغ.</p></div>
 <div class="card"><div class="tw"><table><tr><th>الصالون</th><th>المالك</th><th>الخطة</th><th>ينتهي</th><th>نشط</th><th>الموظفون</th><th>عمليات 30 يومًا</th><th>آخر عملية</th><th></th></tr>
 ${s.map(x=>`<tr><td>${esc(x.name)}<div class="note" dir="ltr">${x.slug}</div></td><td dir="ltr" style="text-align:right">${esc(x.owner_email)}</td>
  <td><select id="pl-${x.id}"><option value="trial" ${x.plan==='trial'?'selected':''}>تجربة</option><option value="monthly" ${x.plan==='monthly'?'selected':''}>شهري</option><option value="yearly" ${x.plan==='yearly'?'selected':''}>سنوي</option></select></td>
  <td><input id="pu-${x.id}" type="date" value="${x.paid_until||''}" style="width:150px" aria-label="ينتهي"></td><td><input id="pa-${x.id}" type="checkbox" ${x.active?'checked':''} style="width:auto" aria-label="نشط"></td>
  <td>${x.staff}</td><td>${x.ops_30d}</td><td>${x.last_op?dt(x.last_op):'—'}</td><td><button class="btn o" onclick="saveSalon('${x.id}')">حفظ</button></td></tr>`).join('')||'<tr><td colspan="9" class="note">لا صالونات بعد</td></tr>'}</table></div></div>`;
 $('#cf').onsubmit=async e=>{e.preventDefault();const r=await rpc('platform_create_salon',{p_name:$('#c1').value,p_slug:$('#c2').value.toLowerCase(),p_owner_name:$('#c3').value,p_owner_email:$('#c4').value,p_owner_password:$('#c5').value,p_plan:$('#c6').value,p_paid_until:$('#c7').value||null});
  toast('أُنشئ الصالون '+r+' — سلّم المالك بريده وكلمة المرور المؤقتة');go('salons')}};
window.saveSalon=async id=>{await rpc('platform_set_salon',{p_id:id,p_active:$('#pa-'+id).checked,p_plan:$('#pl-'+id).value,p_paid_until:$('#pu-'+id).value||null});toast('حُفظ');go('salons')};

boot();
</script></body></html>
